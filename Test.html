<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARY Serials • Premium Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-primary: #08080c;
  --bg-secondary: #0f0f17;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.15);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.65);
  --text-muted: rgba(255,255,255,0.4);
  --accent-1: #00ffff;
  --accent-2: #ff00cc;
  --accent-3: #7c3aed;
  --glow-cyan: rgba(0,255,255,0.4);
  --glow-pink: rgba(255,0,204,0.4);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --transition: cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg-primary: #f5f5f7;
  --bg-secondary: #ffffff;
  --bg-card: rgba(0,0,0,0.02);
  --bg-card-hover: rgba(0,0,0,0.05);
  --border: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.15);
  --text-primary: #0a0a0f;
  --text-secondary: rgba(0,0,0,0.7);
  --text-muted: rgba(0,0,0,0.5);
  --accent-1: #0891b2;
  --accent-2: #db2777;
  --accent-3: #7c3aed;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg-primary);
  min-height: 100vh;
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background 0.4s var(--transition);
  position: relative;
  display: flex;
  flex-direction: column;
}

body::before, body::after {
  content: ''; position: fixed; border-radius: 50%;
  filter: blur(120px); opacity: 0.25;
  pointer-events: none; z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--accent-1), transparent 70%);
  top: -150px; left: -150px;
  animation: float1 20s ease-in-out infinite;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--accent-2), transparent 70%);
  bottom: -200px; right: -200px;
  animation: float2 25s ease-in-out infinite;
}
@keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(100px,100px) scale(1.2); } }
@keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-100px,-100px) scale(1.15); } }

/* Header */
.page-header {
  position: sticky; top: 0; z-index: 50;
  width: 100%;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: color-mix(in srgb, var(--bg-primary) 75%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 14px;
  transition: all 0.3s var(--transition);
}

.page-header.hidden { display: none !important; }

.header-inner {
  max-width: 1100px; margin: 0 auto; width: 100%;
  display: flex; align-items: center; gap: 14px;
}
.back-btn {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); padding: 9px 16px;
  border-radius: 999px; cursor: pointer;
  font-weight: 600; font-size: 13px;
  display: none; align-items: center; gap: 8px;
  transition: all 0.25s var(--transition);
  backdrop-filter: blur(10px);
}
.back-btn:hover {
  border-color: var(--accent-1); color: var(--accent-1);
  transform: translateX(-2px); box-shadow: 0 0 20px var(--glow-cyan);
}
.back-btn.show { display: flex; }

.brand { display: flex; align-items: center; gap: 10px; flex: 1; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  display: grid; place-items: center;
  font-size: 16px; color: #000;
  box-shadow: 0 4px 20px var(--glow-pink);
}
.brand-text {
  font-size: 17px; font-weight: 800; letter-spacing: -0.3px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; }

.theme-toggle {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); cursor: pointer;
  display: grid; place-items: center;
  transition: all 0.3s var(--transition);
}
.theme-toggle:hover {
  border-color: var(--accent-1); color: var(--accent-1);
  transform: rotate(20deg); box-shadow: 0 0 20px var(--glow-cyan);
}

.main-wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 20px; flex: 1; width: 100%; }

/* Hero */
.hero { padding: 40px 0 30px; text-align: center; animation: fadeInUp 0.6s var(--transition); }
.hero h1 {
  font-size: clamp(28px, 5vw, 42px); font-weight: 900;
  letter-spacing: -1px; line-height: 1.1; margin-bottom: 12px;
}
.hero h1 span {
  background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 50%, var(--accent-3) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p { color: var(--text-secondary); font-size: 15px; max-width: 500px; margin: 0 auto; }

/* Search */
.search-wrap { max-width: 500px; margin: 24px auto 0; position: relative; }
.search-wrap i {
  position: absolute; left: 18px; top: 50%;
  transform: translateY(-50%); color: var(--text-muted);
  font-size: 14px; pointer-events: none;
}
#searchInput {
  width: 100%; padding: 14px 18px 14px 46px;
  border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-primary);
  font-size: 14px; font-family: inherit; outline: none;
  transition: all 0.3s var(--transition);
  backdrop-filter: blur(10px);
}
#searchInput::placeholder { color: var(--text-muted); }
#searchInput:focus {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 3px rgba(0,255,255,0.1), 0 0 30px var(--glow-cyan);
}

/* Player section */
#playerSection { display: none; width: 100%; animation: fadeInUp 0.5s var(--transition); }
#playerSection.active { display: block; }

/* Player card */
.player-card {
  width: 100%;
  max-width: 1000px;
  background: #000;
  position: relative;
  border-radius: 0;
  margin: 0 auto;
}
@media (min-width: 768px) {
  .player-card {
    border-radius: 28px 28px 0 0;
    margin-top: 10px;
    box-shadow: 0 30px 50px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
  }
}

/* ✅ ORIGINAL WRAPPER */
.yt-wrapper {
  position: fixed;
  width: 100%;
  padding-bottom: 56.25%;
  height: 400px;
  background: #000;
  overflow: hidden;
  display: block;
  top: -98px;
  left: 0px;
  z-index: 10;
}

/* ✅ BLACK CONTAINER BEHIND CONTROLS */
.overlay {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 59px;
  background: #000000;
  pointer-events: none;
  z-index: 5;
}

.click-capture {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  cursor: pointer;
  background: transparent;
}

/* Loader */
.loader-container {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000000;
  z-index: 25;
  display: flex; justify-content: center; align-items: center;
  transition: opacity 0.4s ease, visibility 0.4s ease;
  visibility: hidden; opacity: 0;
}
.loader-container.active { visibility: visible; opacity: 1; }

.modern-spinner { position: relative; width: 60px; height: 60px; }
.modern-spinner div {
  position: absolute; width: 100%; height: 100%;
  border: 2px solid transparent; border-radius: 50%;
  animation: rotate 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
}
.modern-spinner div:nth-child(1) { border-top-color: var(--accent-1); border-bottom-color: var(--accent-1); animation-delay: -0.45s; }
.modern-spinner div:nth-child(2) { border-left-color: var(--accent-2); border-right-color: var(--accent-2); animation-delay: -0.3s; }
.modern-spinner div:nth-child(3) { border-top-color: #fff; animation-delay: -0.15s; }
@keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* ✅ CENTER PLAY */
.center-play-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: #000000;
  z-index: 20;
  display: flex; justify-content: center; align-items: center;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
.center-play-overlay.hidden { opacity: 0; visibility: hidden; }

.poster-img {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  z-index: 1;
  pointer-events: none;
}

.big-play-btn {
  width: 60px; height: 60px;
  background: #ff00cc;
  border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  cursor: pointer; border: none;
  box-shadow: 0 0 15px #ff00cc, 0 0 30px rgba(255,0,204,0.4);
  border: 2px solid #ff33d6;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative; z-index: 2;
}
.big-play-btn i {
  color: #fff; font-size: 1.8rem; margin-left: 4px;
  filter: drop-shadow(0 0 5px #fff);
}
.big-play-btn:active { transform: scale(0.9); box-shadow: 0 0 10px #ff00cc; }
.big-play-btn:hover { transform: scale(1.05); }

/* ✅ NEON CUSTOM CONTROLS */
.custom-controls {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; flex-direction: column;
  padding: 12px 16px;
  background: transparent;
  z-index: 30;
  transition: opacity 0.3s cubic-bezier(0.2,0.9,0.3,1), transform 0.3s;
  opacity: 1;
  transform: translateY(0);
  pointer-events: none;
}
.custom-controls.hidden {
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
}
.custom-controls > * { pointer-events: auto; }

/* Progress */
.progress-container {
  width: 100%; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
}
.time-current, .time-total {
  font-size: 12px; font-weight: 600;
  color: var(--accent-1);
  text-shadow: 0 0 5px rgba(0,255,255,0.5);
  min-width: 35px;
  font-variant-numeric: tabular-nums;
}
.time-total { text-align: right; color: rgba(0,255,255,0.7); opacity: 0; transition: opacity 0.3s ease; }
.time-total.show { opacity: 1; }

.progress-bar {
  flex: 1; height: 4px;
  background: rgba(0,255,255,0.15);
  border-radius: 10px; cursor: pointer;
  position: relative; transition: height 0.15s;
  box-shadow: inset 0 0 5px rgba(0,255,255,0.2);
}
.progress-bar:hover, .progress-bar:active { height: 6px; }

.progress-buffered {
  position: absolute; inset: 0;
  width: 0%;
  background: rgba(0,255,255,0.15);
  border-radius: 10px;
  pointer-events: none;
}

.progress-filled {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ff00cc, #00ffff);
  border-radius: 10px;
  transition: width 0.1s linear;
  position: relative;
  box-shadow: 0 0 10px #ff00cc, 0 0 20px #00ffff;
}

/* Buttons */
.buttons-row { display: flex; align-items: center; justify-content: space-between; }
.left-controls, .right-controls { display: flex; align-items: center; gap: 10px; }

.ctrl-btn {
  background: rgba(0,255,255,0.05);
  border: 1px solid var(--accent-1);
  color: var(--accent-1);
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; cursor: pointer;
  transition: all 0.2s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 8px rgba(0,255,255,0.3);
}
.ctrl-btn i { font-size: 0.9rem; filter: drop-shadow(0 0 5px var(--accent-1)); }
.ctrl-btn:active { transform: scale(0.9); background: rgba(0,255,255,0.2); box-shadow: 0 0 15px rgba(0,255,255,0.6); }

.play-pause-btn {
  background: #ff00cc; color: #000;
  width: 42px; height: 42px;
  border: 1px solid #ff00cc;
  box-shadow: 0 0 12px #ff00cc, 0 0 25px rgba(255,0,204,0.5);
}
.play-pause-btn i { color: #fff; font-size: 1.1rem; margin-left: 2px; filter: drop-shadow(0 0 3px #fff); }
.play-pause-btn .fa-pause { margin-left: 0; }
.play-pause-btn:active { transform: scale(0.9); background: #ff33d6; }

/* Volume */
.volume-wrap { display: flex; align-items: center; gap: 6px; }
.volume-slider {
  width: 0; opacity: 0;
  transition: all 0.3s var(--transition);
  height: 4px;
  background: rgba(0,255,255,0.15);
  border-radius: 10px; outline: none;
  -webkit-appearance: none; cursor: pointer;
}
.volume-wrap:hover .volume-slider {
  width: 70px; opacity: 1; margin-right: 8px;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent-1);
  box-shadow: 0 0 8px var(--accent-1);
  cursor: pointer;
}
.volume-slider::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent-1);
  border: none;
  box-shadow: 0 0 8px var(--accent-1);
  cursor: pointer;
}

/* Quality */
.quality-wrapper { position: relative; }
.quality-toggle-btn {
  background: rgba(0,255,255,0.05);
  border: 1px solid var(--accent-1);
  border-radius: 40px;
  padding: 4px 12px;
  color: var(--accent-1);
  font-size: 11px; font-weight: 600;
  cursor: pointer; outline: none;
  display: flex; align-items: center; gap: 6px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 8px rgba(0,255,255,0.2);
  height: 34px;
}
.quality-toggle-btn i { font-size: 8px; filter: drop-shadow(0 0 5px var(--accent-1)); }

.quality-menu {
  position: absolute;
  bottom: 45px; right: 0;
  width: 90px; max-height: 120px;
  overflow-y: auto;
  background: rgba(10,10,10,0.95);
  border: 1px solid var(--accent-1);
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,255,255,0.4);
  display: none; flex-direction: column;
  z-index: 50;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.quality-menu::-webkit-scrollbar { width: 4px; }
.quality-menu::-webkit-scrollbar-track { background: rgba(0,255,255,0.1); }
.quality-menu::-webkit-scrollbar-thumb { background: var(--accent-1); border-radius: 4px; }
.quality-menu.active { display: flex; }

.quality-option {
  padding: 8px;
  font-size: 11px;
  color: #fff;
  text-align: center;
  cursor: pointer;
  border-bottom: 1px solid rgba(0,255,255,0.1);
  transition: all 0.2s;
}
.quality-option:last-child { border-bottom: none; }
.quality-option:hover, .quality-option.active {
  background: rgba(0,255,255,0.2);
  color: var(--accent-1);
  text-shadow: 0 0 5px var(--accent-1);
}

.fullscreen-btn {
  background: rgba(255,0,204,0.05);
  border-color: #ff00cc;
  color: #ff00cc;
  box-shadow: 0 0 8px rgba(255,0,204,0.3);
  width: 34px; height: 34px;
}
.fullscreen-btn i { filter: drop-shadow(0 0 5px #ff00cc); font-size: 0.9rem; }
.fullscreen-btn:active { background: rgba(255,0,204,0.2); box-shadow: 0 0 15px rgba(255,0,204,0.6); }

/* ✅ SPACER */
.player-spacer {
  height: 400px;
  width: 100%;
}

/* Playlist grid */
.playlist-section { padding: 30px 0 20px; animation: fadeInUp 0.5s var(--transition); }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.section-title {
  font-size: 20px; font-weight: 800;
  letter-spacing: -0.5px;
  display: flex; align-items: center; gap: 10px;
}
.section-title i { color: var(--accent-2); font-size: 18px; }
.section-count {
  font-size: 12px; color: var(--text-muted);
  background: var(--bg-card); padding: 4px 10px;
  border-radius: 999px; border: 1px solid var(--border);
}

.playlist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.playlist-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  overflow: hidden; cursor: pointer;
  position: relative;
  border: 1px solid var(--border);
  transition: all 0.3s var(--transition);
  display: flex; flex-direction: column;
  animation: fadeInUp 0.5s var(--transition) backwards;
}
.playlist-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-1);
  box-shadow: 0 20px 40px -15px rgba(0,0,0,0.6), 0 0 30px -5px var(--glow-cyan);
  background: var(--bg-card-hover);
}

.playlist-thumb {
  position: relative; overflow: hidden;
  aspect-ratio: 16/9; background: #111;
}
.playlist-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.4s var(--transition);
}
.playlist-card:hover .playlist-thumb img { transform: scale(1.08); }

.playlist-thumb::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);
  opacity: 0; transition: opacity 0.3s;
}
.playlist-card:hover .playlist-thumb::after { opacity: 1; }

.play-badge {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.6);
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
  display: grid; place-items: center;
  opacity: 0;
  transition: all 0.3s var(--transition);
  z-index: 2;
  box-shadow: 0 0 30px var(--glow-pink);
}
.playlist-card:hover .play-badge {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.play-badge i { color: #fff; font-size: 20px; margin-left: 3px; }

.playlist-card-title {
  padding: 12px 14px;
  font-size: 13px; font-weight: 600;
  color: var(--text-primary); line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 50px;
}

/* Episodes */
.episodes-section { padding: 0 0 20px; animation: fadeInUp 0.5s var(--transition); }
.episodes-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (min-width: 768px) {
  .episodes-grid { grid-template-columns: repeat(3, 1fr); }
}

.episode-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  overflow: hidden; cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.25s var(--transition);
  animation: fadeInUp 0.4s var(--transition) backwards;
  display: flex; flex-direction: column;
}
.episode-card:hover {
  border-color: var(--accent-1);
  transform: translateY(-2px);
  box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5), 0 0 25px -10px var(--glow-cyan);
}
.episode-card.active {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 2px var(--accent-2), 0 15px 30px -10px var(--glow-pink);
}

.episode-thumb {
  position: relative; aspect-ratio: 16/9;
  overflow: hidden; background: #111;
}
.episode-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; transition: transform 0.3s;
}
.episode-card:hover .episode-thumb img { transform: scale(1.05); }

.episode-title {
  padding: 10px 12px;
  font-size: 12px; font-weight: 600;
  color: var(--text-primary); line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 48px;
}

/* Skeleton */
.skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.skeleton-card {
  aspect-ratio: 16/9;
  border-radius: var(--radius-md);
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border: 1px solid var(--border);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Empty */
.empty-state {
  grid-column: 1 / -1;
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
}
.empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }

const YOUTUBE_API_KEY = 'AIzaSyACxqw-OnpXUZFv7ym_PTiH4QkdX_KRsN4';

const PLAYLISTS = [
  { title: "Lagan Lagi - Full Episodes", image: "https://i.ytimg.com/vi/XfKWBQkPao4/hqdefault.jpg", playlistId: "PLNAD5uagGaoY", category: "ARY Digital" },
  { title: "Toota Huwa Dil - Full Episodes", image: "https://i.ytimg.com/vi/aknFfkxW7Sk/hqdefault.jpg", playlistId: "PLb2aaNHUy_gG0KbBUk_B_uZWUO2aF_2P4", category: "ARY Digital" },
  { title: "Mahnoor - Full Episodes", image: "https://i.ytimg.com/vi/A-BxuCE3U9E/hqdefault.jpg", playlistId: "PLb2aaNHUy_gG921tRIi80i6YOUaeNz5RG", category: "ARY Digital" },
  { title: "Tum Bin Kesay Jiyen", image: "https://i.ytimg.com/vi/yO7gpS5iBWE/maxresdefault.jpg", playlistId: "PLb2aaNHUy_gFAWdsB89jKYJ-CCL31Is6X", category: "ARY Digital" }
];

let player, isPlayerReady = false, hideControlsTimeout = null;
let controlsVisible = true, isPlaying = false, hasStarted = false;
let isFullscreen = false, lastVolume = 80, currentEpisodes = [];

let currentPage = 0;
const itemsPerPage = 15;
let filteredPlaylists = [...PLAYLISTS];

const $ = id => document.getElementById(id);
const playerCard = $('playerCard'), ytWrapper = $('ytWrapper');
const customControls = $('customControls'), clickCapture = $('clickCapture');
const playPauseBtn = $('playPauseBtn'), playPauseIcon = $('playPauseIcon');
const progressBar = $('progressBar'), progressFilled = $('progressFilled');
const progressBuffered = $('progressBuffered');
const currentTimeEl = $('currentTime'), totalTimeEl = $('totalTime');
const loaderContainer = $('loaderContainer'), centerPlayOverlay = $('centerPlayOverlay');
const bigPlayBtn = $('bigPlayBtn'), posterImage = $('posterImage');
const qualityToggleBtn = $('qualityToggleBtn'), qualityMenu = $('qualityMenu');
const currentQualityLabel = $('currentQualityLabel');
const fullscreenBtn = $('fullscreenBtn'), fullscreenIcon = $('fullscreenIcon');
const playerSection = $('playerSection'), playlistSection = $('playlistSection');
const playlistGrid = $('playlistGrid'), episodesGrid = $('episodesGrid');
const backBtn = $('backBtn'), pageTitle = $('pageTitle');
const floatingAllDramas = $('floatingAllDramas');

const themeToggle = $('themeToggle'), themeIcon = $('themeIcon');
const muteBtn = $('muteBtn'), volumeIcon = $('volumeIcon'), volumeSlider = $('volumeSlider');

// Theme Setup
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
});
function updateThemeIcon(theme) {
  themeIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
}

function renderPlaylistGrid(filter = '', resetPage = true) {
  filteredPlaylists = PLAYLISTS.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()));
  if (resetPage) currentPage = 0;
  
  const startIndex = currentPage * itemsPerPage;
  const endIndex = Math.min(startIndex + itemsPerPage, filteredPlaylists.length);
  const currentItems = filteredPlaylists.slice(startIndex, endIndex);

  playlistGrid.innerHTML = '';
  $('playlistCount').textContent = filteredPlaylists.length;
  pageInfo.textContent = `Showing ${endIndex} of ${filteredPlaylists.length} dramas`;

  prevBtn.style.display = currentPage > 0 ? 'block' : 'none';
  nextBtn.style.display = endIndex < filteredPlaylists.length ? 'block' : 'none';

  if (filteredPlaylists.length === 0) {
    playlistGrid.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <i class="fas fa-search"></i>
        <h3>No results found</h3>
        <p>Try a different search term</p>
      </div>`;
    return;
  }

  currentItems.forEach((pl, i) => {
    const card = document.createElement('div');
    card.className = 'playlist-card';
    card.style.animationDelay = (i * 0.05) + 's';
    card.onclick = () => openPlaylist(pl.playlistId, pl.title, pl.image);
    card.innerHTML = `
      <div class="playlist-thumb">
        <img src="${pl.image}" alt="${pl.title}" loading="lazy">
        <div class="play-badge"><i class="fas fa-play"></i></div>
      </div>
      <div class="playlist-card-title">${pl.title}</div>
    `;
    playlistGrid.appendChild(card);
  });
}

nextBtn.addEventListener('click', () => {
  if ((currentPage + 1) * itemsPerPage < filteredPlaylists.length) {
    currentPage++;
    renderPlaylistGrid(searchInput.value, false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

prevBtn.addEventListener('click', () => {
  if (currentPage > 0) {
    currentPage--;
    renderPlaylistGrid(searchInput.value, false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

async function openPlaylist(playlistId, title, coverImage) {
  history.pushState({ page: 'player', playlistId }, '', '#playlist');

  playlistSection.style.display = 'none';
  playerSection.classList.add('active');
  mainHeader.classList.add('hidden');

  backBtn.classList.add('show');
  floatingAllDramas.classList.add('show');
  pageTitle.textContent = title;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  hasStarted = false;
  centerPlayOverlay.classList.remove('hidden');
  posterImage.src = coverImage;
  totalTimeEl.textContent = '0:00';
  totalTimeEl.classList.remove('show');
  currentTimeEl.textContent = '0:00';
  progressFilled.style.width = '0%';
  progressBuffered.style.width = '0%';

  episodesGrid.innerHTML = `
    <div class="skeleton-grid" style="grid-column:1/-1;">
      ${Array(6).fill('<div class="skeleton-card"></div>').join('')}
    </div>`;

  try {
    let allItems = [];
    let nextPageToken = '';
    let fetchMore = true;

    while (fetchMore) {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}${nextPageToken ? '&pageToken=' + nextPageToken : ''}`);
      const data = await res.json();
      
      if (data.error) {
        throw new Error(data.error.message || "API Error");
      }
      
      if (data.items) allItems = allItems.concat(data.items);
      
      if (data.nextPageToken) {
        nextPageToken = data.nextPageToken;
      } else {
        fetchMore = false;
      }
    }

    if (allItems.length === 0) {
      episodesGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <i class="fas fa-film"></i>
        <h3>No episodes found</h3>
        <p>This playlist appears to be empty</p>
      </div>`;
      return;
    }

    const rawVideos = [];
    const seenIds = new Set();
    
    allItems.forEach(item => {
      if (item.snippet && item.snippet.resourceId && item.snippet.resourceId.videoId) {
        const videoId = item.snippet.resourceId.videoId;
        const vidTitle = item.snippet.title;

        const isPrivate = !vidTitle || 
                          vidTitle.toLowerCase().includes('private video') || 
                          vidTitle.toLowerCase().includes('deleted video');

        if (!seenIds.has(videoId) && !isPrivate) { 
          seenIds.add(videoId); 
          rawVideos.push(item); 
        }
      }
    });
    
    // Tarteeb wise sort karein
    rawVideos.sort((a, b) => new Date(a.snippet.publishedAt) - new Date(b.snippet.publishedAt));

    // ✅ STRICT DUPLICATE EPISODE NUMBER REMOVAL
    const uniqueVideos = [];
    const seenEpisodeNumbers = new Set();

    rawVideos.forEach((item, idx) => {
      const originalTitle = item.snippet.title;
      let epNum = idx + 1; // Default sequential fallback

      const epMatch = originalTitle.match(/(?:episode|ep)\s*[-:]?\s*(\d+)/i);
      if (epMatch && epMatch[1]) {
        epNum = parseInt(epMatch[1], 10);
      }

      // Agar yeh episode number pehle aa chuka hai, toh dobara add mat karo
      if (!seenEpisodeNumbers.has(epNum)) {
        seenEpisodeNumbers.add(epNum);
        item.extractedEpNum = epNum; // Store clean episode number
        uniqueVideos.push(item);
      }
    });
    
    if (uniqueVideos.length === 0) {
      episodesGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>No valid episodes found.</p></div>`;
      return;
    }

    const firstVideoId = uniqueVideos[0].snippet.resourceId.videoId;
    posterImage.src = coverImage;

    if (player?.loadVideoById) {
      player.loadVideoById(firstVideoId);
      player.pauseVideo();
    }

    currentEpisodes = uniqueVideos;
    episodesGrid.innerHTML = '';
    $('episodeCount').textContent = uniqueVideos.length;

    uniqueVideos.forEach((item, idx) => {
      const videoId = item.snippet.resourceId.videoId;
      let thumbnail = coverImage;
      
      if (item.snippet.thumbnails) {
        if (item.snippet.thumbnails.high) thumbnail = item.snippet.thumbnails.high.url;
        else if (item.snippet.thumbnails.medium) thumbnail = item.snippet.thumbnails.medium.url;
        else if (item.snippet.thumbnails.default) thumbnail = item.snippet.thumbnails.default.url;
      }

      const epNum = item.extractedEpNum;
      const displayTitle = `Episode ${epNum < 10 ? '0' + epNum : epNum}`;

      const card = document.createElement('div');
      card.className = 'episode-card' + (idx === 0 ? ' active' : '');
      card.style.animationDelay = (idx * 0.03) + 's';
      card.dataset.videoId = videoId;
      card.onclick = () => {
        document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        changeVideo(videoId, displayTitle, thumbnail);
        const playerBottom = ytWrapper.getBoundingClientRect().bottom;
        if (playerBottom < 0) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      
      card.innerHTML = `
        <div class="episode-thumb">
          <img src="${thumbnail}" alt="" loading="lazy">
        </div>
        <div class="episode-title">${displayTitle}</div>
      `;
      episodesGrid.appendChild(card);
    });
  } catch (err) {
    console.error("API Error:", err);
    episodesGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <i class="fas fa-triangle-exclamation"></i>
      <h3>Failed to load</h3>
      <p>Check your API key or internet connection</p>
    </div>`;
  }
}

function onPlayerReady() {
  isPlayerReady = true;
  player.setVolume(80);
  volumeSlider.value = 80;

  setTimeout(() => {
    const iframe = document.querySelector('#youtube-player iframe');
    if (iframe) {
      Object.assign(iframe.style, {
        position: 'absolute', top: 0, left: 0, width: '100%', height: '100%'
      });
    }
    populateQualities();
    totalTimeEl.textContent = '0:00';
    totalTimeEl.classList.remove('show');
  }, 1000);

  showControls();
  clearTimeout(hideControlsTimeout);

  setInterval(() => { if (isPlayerReady && player?.getCurrentTime) updateProgress(); }, 250);
}

function onPlayerStateChange(e) {
  if (e.data === YT.PlayerState.BUFFERING && hasStarted) {
    loaderContainer.classList.add('active');
  }
  if (e.data === YT.PlayerState.PLAYING) {
    centerPlayOverlay.classList.add('hidden');
    loaderContainer.classList.remove('active');
    ytPauseOverlay.style.display = 'none'; 
    
    isPlaying = true;
    playPauseIcon.classList.remove('fa-play');
    playPauseIcon.classList.add('fa-pause');

    if (player?.getDuration) {
      totalTimeEl.textContent = fmt(player.getDuration());
      totalTimeEl.classList.add('show');
    }

    if (isFullscreen) {
      clearTimeout(hideControlsTimeout);
      hideControlsTimeout = setTimeout(hideControls, 5000);
    } else {
      showControls(); 
      clearTimeout(hideControlsTimeout);
    }
  }
  if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
    isPlaying = false;
    playPauseIcon.classList.remove('fa-pause');
    playPauseIcon.classList.add('fa-play');
    ytPauseOverlay.style.display = 'block'; 
    
    showControls();
    clearTimeout(hideControlsTimeout);
  }
}

function updateProgress() {
  if (!player?.getCurrentTime) return;
  const cur = player.getCurrentTime() || 0;
  currentTimeEl.textContent = fmt(cur);

  if (player.getPlayerState() === 1 && !totalTimeEl.classList.contains('show')) {
    totalTimeEl.classList.add('show');
  }

  const dur = player.getDuration() || 0;
  if (dur > 0) {
    progressFilled.style.width = ((cur / dur) * 100) + '%';
    const buf = player.getVideoLoadedFraction?.() || 0;
    progressBuffered.style.width = (buf * 100) + '%';
  }
}

function fmt(s) {
  if (isNaN(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

function showControls() {
  customControls.classList.remove('hidden');
  controlsVisible = true;
  clearTimeout(hideControlsTimeout);
}
function hideControls() {
  customControls.classList.add('hidden');
  controlsVisible = false;
  qualityMenu.classList.remove('active');
}
function resetHideControlsTimer() {
  clearTimeout(hideControlsTimeout);
  if (controlsVisible && isFullscreen) {
    hideControlsTimeout = setTimeout(hideControls, 5000);
  }
}
function showControlsTemporarily() {
  showControls();
  resetHideControlsTimer();
}

bigPlayBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!player?.playVideo) return;
  hasStarted = true;
  centerPlayOverlay.classList.add('hidden');
  loaderContainer.classList.add('active');
  player.unMute();
  player.playVideo();
});

clickCapture.addEventListener('click', e => {
  e.stopPropagation();
  if (!hasStarted) return;
  if (controlsVisible) { 
    hideControls(); 
    clearTimeout(hideControlsTimeout); 
  } else { 
    showControls(); 
    resetHideControlsTimer(); 
  }
});

playPauseBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!player) return;
  isPlaying ? player.pauseVideo() : player.playVideo();
  showControlsTemporarily();
});

$('rewind10').addEventListener('click', e => {
  e.stopPropagation();
  if (player?.getCurrentTime) {
    player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
    showControlsTemporarily();
  }
});
$('forward10').addEventListener('click', e => {
  e.stopPropagation();
  if (player?.getDuration) {
    player.seekTo(Math.min(player.getDuration(), player.getCurrentTime() + 10), true);
    showControlsTemporarily();
  }
});

progressBar.addEventListener('click', e => {
  e.stopPropagation();
  if (!player?.getDuration) return;
  const r = progressBar.getBoundingClientRect();
  const p = (e.clientX - r.left) / r.width;
  player.seekTo(p * player.getDuration(), true);
  showControlsTemporarily();
});

muteBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!player) return;
  if (player.isMuted()) {
    player.unMute();
    player.setVolume(lastVolume);
    volumeSlider.value = lastVolume;
    volumeIcon.className = 'fas fa-volume-high';
  } else {
    lastVolume = player.getVolume();
    player.mute();
    volumeSlider.value = 0;
    volumeIcon.className = 'fas fa-volume-xmark';
  }
});
volumeSlider.addEventListener('input', e => {
  e.stopPropagation();
  if (!player) return;
  const v = parseInt(e.target.value);
  player.setVolume(v);
  player.unMute();
  lastVolume = v;
  if (v === 0) volumeIcon.className = 'fas fa-volume-xmark';
  else if (v < 50) volumeIcon.className = 'fas fa-volume-low';
  else volumeIcon.className = 'fas fa-volume-high';
});

qualityToggleBtn.addEventListener('click', e => {
  e.stopPropagation();
  qualityMenu.classList.toggle('active');
  showControlsTemporarily();
});
document.addEventListener('click', e => {
  if (!qualityToggleBtn.contains(e.target) && !qualityMenu.contains(e.target)) {
    qualityMenu.classList.remove('active');
  }
});
qualityMenu.addEventListener('click', e => {
  if (!e.target.classList.contains('quality-option')) return;
  const q = e.target.dataset.quality;
  currentQualityLabel.textContent = e.target.textContent;
  document.querySelectorAll('.quality-option').forEach(o => o.classList.remove('active'));
  e.target.classList.add('active');
  player?.setPlaybackQuality?.(q);
  qualityMenu.classList.remove('active');
  showControlsTemporarily();
});

function populateQualities() {
  if (!player?.getAvailableQualityLevels) return;
  const levels = player.getAvailableQualityLevels();
  const map = {
    highres: '4K+', hd1080: '1080p', hd720: '720p',
    large: '480p', medium: '360p', small: '240p', tiny: '144p'
  };
  qualityMenu.innerHTML = '<div class="quality-option active" data-quality="default">Auto</div>';
  ['highres', 'hd1080', 'hd720', 'large', 'medium', 'small', 'tiny'].forEach(l => {
    if (levels.includes(l)) {
      const o = document.createElement('div');
      o.className = 'quality-option';
      o.dataset.quality = l;
      o.textContent = map[l] || l;
      qualityMenu.appendChild(o);
    }
  });
}

fullscreenBtn.addEventListener('click', async e => {
  e.stopPropagation();
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (playerCard.requestFullscreen) await playerCard.requestFullscreen();
      else if (playerCard.webkitRequestFullscreen) await playerCard.webkitRequestFullscreen();
      fullscreenIcon.classList.remove('fa-expand');
      fullscreenIcon.classList.add('fa-compress');
      isFullscreen = true;
      showControls();
      resetHideControlsTimer();
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      fullscreenIcon.classList.remove('fa-compress');
      fullscreenIcon.classList.add('fa-expand');
      isFullscreen = false;
      showControls();
      clearTimeout(hideControlsTimeout);
    }
  } catch (err) { console.log(err); }
});

const handleFullscreenChange = () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    fullscreenIcon.classList.remove('fa-compress');
    fullscreenIcon.classList.add('fa-expand');
    isFullscreen = false;
    showControls();
    clearTimeout(hideControlsTimeout);
  }
};
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

function changeVideo(videoId, title, thumbnailUrl) {
  if (!player?.loadVideoById) return;
  hasStarted = true;
  centerPlayOverlay.classList.add('hidden');
  loaderContainer.classList.add('active');
  posterImage.src = thumbnailUrl || `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
  totalTimeEl.textContent = '0:00';
  totalTimeEl.classList.remove('show');
  player.unMute();
  player.loadVideoById(videoId);
  player.playVideo();
  progressFilled.style.width = '0%';
  currentTimeEl.textContent = '0:00';
  setTimeout(populateQualities, 1500);
}

searchInput.addEventListener('input', e => {
  renderPlaylistGrid(e.target.value, true);
});
backBtn.addEventListener('click', showPlaylistGrid);
floatingAllDramas.addEventListener('click', showPlaylistGrid);
ytWrapper.addEventListener('contextmenu', e => e.preventDefault());

customControls.addEventListener('mouseenter', () => clearTimeout(hideControlsTimeout));
customControls.addEventListener('mouseleave', () => { if (controlsVisible && isFullscreen) resetHideControlsTimer(); });
customControls.addEventListener('touchstart', () => clearTimeout(hideControlsTimeout), { passive: true });
customControls.addEventListener('click', e => { e.stopPropagation(); showControlsTemporarily(); });

history.replaceState({ page: 'home' }, '', window.location.pathname);

renderPlaylistGrid();
</script>
</body>
</html>
